spring.application.name=keytrace

# where the database is, and how to log in (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/keytrace
spring.datasource.username=keytrace
spring.datasource.password=keytrace

# create/update tables automatically from our Java classes (fine for development)
spring.jpa.hibernate.ddl-auto=update

# print the SQL that Spring runs, so you can see what's happening
spring.jpa.show-sql=true